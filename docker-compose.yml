version: '3.8'

services:
  mysql:
    image: mysql:8
    container_name: campus-trade-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: campus_trade
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campus-trade-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_HOST: mysql
      DATABASE_PORT: "3306"
      DATABASE_USER: root
      DATABASE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      DATABASE_NAME: campus_trade
      JWT_SECRET: ${JWT_SECRET:-campus-trade-jwt-secret}
      JWT_EXPIRES_IN: 7d
      API_PORT: "7001"
    ports:
      - "7001:7001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:7001/api
    container_name: campus-trade-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  mysql_data: