name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_DATABASE: campus_trade
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./backend/package-lock.json

      - run: npm install

      - run: npx tsc --noEmit

      - run: npx jest --runInBand --verbose
        env:
          MIDWAY_TS_MODE: "true"
          MIDWAY_JEST_MODE: "true"
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: "3306"
          DATABASE_USER: root
          DATABASE_PASSWORD: ""
          DATABASE_NAME: campus_trade

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./frontend/package-lock.json

      - run: npm install

      - run: npx tsc --noEmit

      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:7001/api